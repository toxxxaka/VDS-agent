server {
    listen 80;
    listen [::]:80;
    server_name monitoring-mcp.0x870x4k3r.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring-mcp.0x870x4k3r.tech;

    ssl_certificate /etc/letsencrypt/live/monitoring-mcp.0x870x4k3r.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring-mcp.0x870x4k3r.tech/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /healthz { return 404; }
    location = /mcp {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / { return 404; }
}
