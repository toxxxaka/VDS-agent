# Include from nginx http {} context. One switch controls all public VDS-Agent vhosts.
# Modes: off (no matching/logging/limit), observe (log matching UAs; rate-limit search crawlers),
# enforce (also return 403 to listed unwanted bots). Do not whitelist by User-Agent.
map $host $vds_agent_bot_mode { default observe; }

map $http_user_agent $vds_agent_bot_detected {
    default 0;
    ~*(ShapBot|ClaudeBot|GenomeCrawlerd|AhrefsBot|Reflectionbot|getdomaindata|KeenableBot|heritrix|YaK|Keenable-User|DataIndex\.pro|WebSiphon|2ip[[:space:]]*bot|WebCopier|ApcosysBot|ForestEngine|zgrab|CensysInspect|Palo[[:space:]]*Alto[[:space:]]*Networks|HMap-Embodied-Inventory|visionheight\.com/scan|redirect-scanner|libredtail-http|Infrawatch|InternetMeasurement|ModatScanner|NetcraftSurveyAgent|CVE-2023-20198|Scrapy) 1;
}
map "$vds_agent_bot_mode:$vds_agent_bot_detected" $vds_agent_bot_block {
    default 0;
    "enforce:1" 1;
}
map "$vds_agent_bot_mode:$vds_agent_bot_detected" $vds_agent_bot_log {
    default 0;
    "observe:1" 1;
    "enforce:1" 1;
}
# Search crawlers are never trusted by their declared User-Agent: they only get
# a smaller shared rate-limit bucket, so spoofing Google gains no bypass.
map "$vds_agent_bot_mode:$http_user_agent" $vds_agent_search_key {
    default "";
    ~*^(observe|enforce):.*(Googlebot|GoogleOther|OAI-SearchBot|ExaSearchBot) $binary_remote_addr;
}
limit_req_zone $vds_agent_search_key zone=vds_agent_search_crawler:10m rate=2r/s;
log_format vds_agent_bot '$time_iso8601 $remote_addr "$host" "$request" $status "$http_user_agent"';
