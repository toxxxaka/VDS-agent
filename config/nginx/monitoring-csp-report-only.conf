# Report-only until native Telegram and Telegram Web have been observed.
# Do not add X-Frame-Options to the Mini App entry point.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self' https://*.telegram.org; report-uri /csp-report" always;
