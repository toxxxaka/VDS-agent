# Include in the monitoring virtual host during the S-02 observation period.
# Do not deploy this file without first reviewing the target server/location.
# Telegram Mini App framing remains report-only until Telegram Web behavior is tested.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; report-uri /csp-report" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
