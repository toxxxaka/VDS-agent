# Include from each protected server block. It accepts only small CSP reports.
location = /csp-report {
    if ($request_method != POST) { return 405; }
    client_max_body_size 10k;
    limit_req zone=vds_site_per_ip burst=5 nodelay;
    add_header Cache-Control "no-store" always;
    return 204;
}
