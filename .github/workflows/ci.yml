name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile v3.py health_monitor.py oom_monitor.py v4/*.py tests/*.py
      - run: PYTHONPATH=. python -m unittest discover -v
      - name: Guard against committed credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          token_line = re.compile(r"^(TELEGRAM_BOT_TOKEN|TIMEWEB_AI_API_TOKEN|MONITORINGBOT_MCP_TOKEN)=(.*)$")
          telegram = re.compile(r"^[0-9]{8,}:[A-Za-z0-9_-]{20,}$")
          private_key = re.compile(r"-----BEGIN (?:RSA|OPENSSH|EC) PRIVATE KEY-----")
          forbidden = re.compile(r"\b(?:sk|rk)-[A-Za-z0-9_-]{20,}")
          placeholders = {
              "TELEGRAM_BOT_TOKEN": {"PASTE_NEW_TELEGRAM_BOT_TOKEN_HERE"},
              "TIMEWEB_AI_API_TOKEN": {"replace-with-private-token"},
              "MONITORINGBOT_MCP_TOKEN": {"replace-with-a-64-hex-character-token"},
          }
          findings = []
          for name in tracked:
              if not name or name.startswith(".git/"):
                  continue
              try:
                  text = Path(name).read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if private_key.search(text) or forbidden.search(text):
                  findings.append(f"credential-like content in {name}")
              for line in text.splitlines():
                  match = token_line.match(line.strip())
                  if not match:
                      continue
                  key, value = match.groups()
                  if value not in placeholders[key] and (key != "TELEGRAM_BOT_TOKEN" or telegram.fullmatch(value)):
                      findings.append(f"non-placeholder {key} in {name}")
          if findings:
              print("\n".join(findings), file=sys.stderr)
              raise SystemExit(1)
          PY
