name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile v3.py health_monitor.py oom_monitor.py v4/*.py
      - run: PYTHONPATH=. python -m unittest discover -v
      - run: "! git grep -nEI \"(TELEGRAM_BOT_TOKEN|X_AGENT_MCP_TOKEN|BEGIN (RSA|OPENSSH) PRIVATE KEY)\\s*=?.{12,}\""
